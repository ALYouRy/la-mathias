name: Appli iPhone

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/patchnotes.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Outils
        run: brew install xcodegen

      - name: Projet Xcode
        working-directory: ios
        run: |
          VER="1.0.${GITHUB_RUN_NUMBER}"
          sed -i '' "s/CFBundleShortVersionString: \"1.0\"/CFBundleShortVersionString: \"${VER}\"/; s/CFBundleVersion: \"1\"/CFBundleVersion: \"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate

      - name: Compilation
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project LaMathias.xcodeproj -scheme LaMathias -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log \
            | grep -E "error:|warning: unre|BUILD" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            grep -E "^/.*:[0-9]+:[0-9]+: error:" build.log | sort -u | head -40 | while IFS= read -r l; do
              f=$(echo "$l" | cut -d: -f1 | sed "s#.*/ios/#ios/#"); n=$(echo "$l" | cut -d: -f2); m=$(echo "$l" | cut -d: -f5-)
              echo "::error file=$f,line=$n::$m"
            done
            grep -E "error:" build.log | grep -v "^/" | sort -u | head -10 | while IFS= read -r l; do echo "::error ::$l"; done
            exit 1
          fi

      - name: Fichier IPA
        working-directory: ios
        run: |
          # 2.91 : signature locale avec le groupe d'applis (SideStore le lit pour créer la zone partagée des widgets)
          APP=build/Build/Products/Release-iphoneos/LaMathias.app
          codesign -f -s - --entitlements LaMathiasWidget/LaMathiasWidget.entitlements "$APP/PlugIns/LaMathiasWidget.appex"
          codesign -f -s - --entitlements LaMathias/LaMathias.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -i group || true
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LaMathias.app Payload/
          zip -qry LaMathias.ipa Payload
          ls -l LaMathias.ipa

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-1.0.${GITHUB_RUN_NUMBER}"
          VER="1.0.${GITHUB_RUN_NUMBER}"
          SIZE=$(stat -f%z ios/LaMathias.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/LaMathias.ipa"
          ICON="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/icon.png"
          python3 ios/make-source.py "${GITHUB_REPOSITORY}" "$TAG" "$SIZE" "$DATE" > ios/source.json
          gh release create "$TAG" ios/LaMathias.ipa ios/source.json --title "Appli iPhone 1.0.${GITHUB_RUN_NUMBER}" --notes-file <(python3 -c "import json;n=json.load(open('ios/patchnotes.json'))[0];print(n['v']+' · '+n['title']);[print('• '+x) for x in n['notes']]") --latest
