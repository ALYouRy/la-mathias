<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Mathias">
<meta name="theme-color" content="#07051a">
<link rel="apple-touch-icon" href="icon.png?v=3d">
<link rel="manifest" href="manifest.webmanifest">
<title>La Mathias</title>
<style>
:root{
  --bg:#07051a;--surface:#0e0b22;--surface-2:#16123a;--line:rgba(170,130,255,.20);
  --fg:#f2efff;--fg-2:#a9a1d6;--fg-3:#7d74b0;--accent:#00e5ff;--accent-rgb:0,229,255;--g1:255,0,170;--g2:0,229,255;
  --good:#34d17a;--warn:#ffb020;--bad:#ff4d4f;--track:rgba(255,255,255,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
/* 2.36 : page fixe : pas de zoom au pincement ni au double-toucher, pas de glissement sur le côté, pas de rebond */
html,body{overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{touch-action:pan-x pan-y;width:100%}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px);
  background:radial-gradient(700px 500px at 10% -10%,rgba(var(--g1),.16),transparent 60%),radial-gradient(600px 500px at 100% 100%,rgba(var(--g2),.10),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.hd h1{margin:0;font-size:32px;font-weight:750;letter-spacing:-.03em}
.hd small{display:block;margin-top:2px;font-size:13px;color:var(--fg-2);font-weight:500}
.plate{display:inline-flex;align-items:stretch;border-radius:6px;overflow:hidden;border:1.5px solid #16181c;background:#f4f5f7;color:#111;font-weight:800;font-size:14px;letter-spacing:.02em;font-family:"Arial Narrow",Arial,sans-serif;flex:0 0 auto}
.plate[hidden]{display:none}
.plate i{background:#0b3d91;color:#fff;font-style:normal;font-size:9px;display:flex;align-items:flex-end;padding:0 4px 2px}
.plate span{padding:4px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px;box-shadow:0 0 0 1px rgba(var(--accent-rgb),.06),0 0 22px rgba(var(--accent-rgb),.06)}
.card h2{margin:0 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#c6a8ff}
.fu{display:flex;align-items:flex-end;justify-content:space-between}
.fu b{display:block;font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1;text-shadow:0 0 14px rgba(var(--accent-rgb),.45)}
.fu .r{text-align:right}.fu .r b{font-size:24px}
.fu small{display:block;margin-top:5px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
.bar{position:relative;height:8px;border-radius:5px;background:var(--track);overflow:hidden;margin:12px 0 8px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--accent);border-radius:5px}
.bar[data-s="warn"] i{background:var(--warn)}.bar[data-s="bad"] i{background:var(--bad)}
.note{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--fg-3)}
.mh{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 4px}
.mh b{font-size:17px;font-weight:700}
.mh button{background:none;border:0;font-size:26px;padding:4px 12px;color:var(--fg-2)}
.mh button:disabled{opacity:.25}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;padding:10px 0 8px}
.g4 b{display:block;font-size:28px;font-weight:620;letter-spacing:-.03em;line-height:1.05;text-shadow:0 0 12px rgba(var(--accent-rgb),.35)}
.g4 b u{text-decoration:none;font-size:13px;font-weight:600;color:var(--fg-2);margin-left:3px;text-shadow:none}
.g4 small{display:block;margin-top:4px;font-size:12px;font-weight:600;color:var(--fg-2)}
.g4 em{display:block;margin-top:2px;font-style:normal;font-size:11.5px;font-weight:600;color:var(--fg-3)}
.g4 em.good{color:var(--good)}.g4 em.bad{color:var(--warn)}
.sub{display:flex;flex-wrap:wrap;gap:4px 16px;padding:10px 0 2px;border-top:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.sub b{color:var(--fg)}
.ch{padding:12px 0 2px}
.ch .h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:6px}
.ch .h b{color:var(--fg)}
.ch svg{display:block;width:100%;height:56px}
.ch rect{fill:var(--accent);opacity:.9}.ch rect.z{fill:var(--track);opacity:1}
.ch .x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg-3);margin-top:4px;font-weight:600}
.det div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--fg-2)}
.det b{color:var(--fg);font-weight:650;white-space:nowrap}
.day{margin:16px 4px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.tr{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.tr .t1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tr .t1 b{font-size:16px;font-weight:650}
.tr .t2{display:flex;gap:14px;margin-top:4px;font-size:13px;color:var(--fg-2)}
.tr .more{display:none;margin-top:10px}
.tr.open .more{display:block}
.eco{display:inline-flex;align-items:center;gap:4px;min-width:40px;justify-content:center;padding:3px 8px;border-radius:9px;font-size:13px;font-weight:750}
.eco[data-s="ok"]{background:rgba(52,209,122,.14);color:var(--good)}
.eco[data-s="warn"]{background:rgba(255,176,32,.14);color:var(--warn)}
.eco[data-s="bad"]{background:rgba(255,77,79,.14);color:var(--bad)}
.empty{text-align:center;padding:30px 10px 10px}
.empty>b{display:block;font-size:20px;margin-bottom:8px}
.empty p{font-size:14px;line-height:1.5;color:var(--fg-2);margin:0 0 14px}
.empty ol b{color:var(--fg)}
.empty ol{text-align:left;font-size:14px;line-height:1.55;color:var(--fg-2);padding-left:20px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:650;font-size:16px;background:var(--accent);color:#001318;box-shadow:0 6px 22px rgba(var(--accent-rgb),.35)}
.btn.ghost{background:var(--surface-2);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.dock{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;z-index:5}
.dock .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:rgba(10,8,25,.95);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-size:14px;font-weight:600;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.scan{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scan video{width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;width:72vw;max-width:340px;aspect-ratio:1;border-radius:24px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);border:3px solid var(--accent)}
.scan .msg{position:absolute;top:calc(env(safe-area-inset-top) + 24px);left:20px;right:20px;text-align:center;font-size:15px;font-weight:600;text-shadow:0 1px 6px #000}
.scan .btn{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 24px)}
.car3d{position:relative;margin:-6px -16px 6px;height:280px}
.car3d canvas{display:block;width:100%;height:100%}
.car3d .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11.5px;font-weight:600;color:var(--fg-3);pointer-events:none;transition:opacity .6s}
.car3d.err canvas{display:none}
.lock{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 11px;border-radius:999px;border:1px solid rgba(52,209,122,.35);background:rgba(52,209,122,.12);color:var(--good);font-size:14px;font-weight:700;z-index:2;transition:background .3s,border-color .3s,color .3s}
.lock svg{width:17px;height:17px;display:block}
.lock .sh{transition:transform .3s;transform-origin:16px 9px}
.lock.open{border-color:rgba(255,176,32,.40);background:rgba(255,176,32,.12);color:var(--warn)}
.lock.open .sh{transform:translateX(5px) rotate(18deg)}
.lock.pulse{animation:lp .45s ease}
@keyframes lp{50%{transform:translateX(-50%) scale(1.08)}}
.car3d .hint{bottom:44px}
.fv{padding:12px 0;border-top:1px solid var(--line)}
.fv:first-of-type{border-top:0;padding-top:4px}
.fv .t1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fv .t1 b{font-size:17px;font-weight:700}
.fv .t1 small{display:block;margin-top:2px;font-size:12.5px;color:var(--fg-2);font-weight:600}
.fv .t1 .c{text-align:right;white-space:nowrap}
.fv .t1 .c b{font-size:24px;font-weight:600;letter-spacing:-.03em}
.fv .t1 .c u{text-decoration:none;font-size:12px;color:var(--fg-2);margin-left:2px}
.fv .ls{margin-top:8px;padding:8px 11px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--fg-2);line-height:1.45}
.fv .ls b{color:var(--fg)}.fv .good{color:var(--good);font-weight:700}.fv .bad{color:var(--warn);font-weight:700}
.fv .g{display:flex;gap:18px;margin-top:8px;font-size:12px;color:var(--fg-3);font-weight:600}
.fv .g b{display:block;font-size:15px;color:var(--fg)}
.ftag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:7px;background:rgba(0,229,255,.13);color:var(--accent);font-size:11px;font-weight:700;vertical-align:2px}
/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:rgba(9,7,26,.86);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:5px 0 2px;color:var(--fg-3);font-size:10.5px;font-weight:650;letter-spacing:.01em}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button[aria-selected="true"] svg{filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),.55))}
.hd-r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.hd>div:first-child{flex:1 1 auto;min-width:0}.hd small{overflow-wrap:anywhere}.hd .lvc{max-width:100%}
.qrb{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;padding:0}
.qrb svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round}
.ttl{margin:4px 2px 12px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.lt .t1 b{font-size:17px}
/* ---------- animation d'ouverture ---------- */
.sp{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(70% 45% at 50% 46%,#1a0f45 0%,#07051a 62%,#030210 100%);animation:spOut .55s cubic-bezier(.6,0,.4,1) 2.35s forwards}
.sp.skip{animation:spOut .3s ease forwards}
.sp::before{content:"";position:absolute;width:140vmax;height:140vmax;left:50%;top:46%;transform:translate(-50%,-50%);
  background:conic-gradient(from 0deg,transparent 0 70%,rgba(0,229,255,.10) 80%,rgba(255,0,170,.14) 88%,transparent 96%);animation:spSweep 2.4s linear both;opacity:.9}
.sp svg{position:relative;width:min(88vw,420px);height:auto;overflow:visible}
.sp .bd{fill:none;stroke:#00e5ff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 4px #00e5ff) drop-shadow(0 0 12px rgba(0,229,255,.7));animation:spDraw 1.15s cubic-bezier(.65,0,.35,1) .15s forwards}
.sp .gl{fill:none;stroke:#ff3fd0;stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 5px #ff3fd0);animation:spDraw .8s ease .55s forwards}
.sp .wh{fill:none;stroke:#00e5ff;stroke-width:2.2;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px #00e5ff);animation:spDraw .7s ease .75s forwards}
.sp .rim{fill:none;stroke:rgba(0,229,255,.55);stroke-width:1.2;opacity:0;animation:spFade .4s ease 1.2s forwards}
.sp .fl{stroke:rgba(255,255,255,.18);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .9s ease .2s forwards}
.sp .hl{fill:#fff;opacity:0;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #bff6ff);animation:spFlash .9s ease 1.25s forwards}
.sp .sg path{vector-effect:non-scaling-stroke}
.sp .bm{fill:url(#spBeam);opacity:0;transform-origin:262px 61px;animation:spBeamA 1.1s ease 1.3s forwards}
.sp .tl{fill:#ff2d55;opacity:0;filter:drop-shadow(0 0 6px #ff2d55);animation:spFade .35s ease 1.15s forwards}
.sp h1{position:relative;margin:26px 0 0;font-size:29px;white-space:nowrap;font-weight:800;letter-spacing:.9em;padding-left:.9em;color:#f2efff;opacity:0;
  text-shadow:0 0 18px rgba(0,229,255,.75),0 0 2px #fff;animation:spTitle 1s cubic-bezier(.2,.7,.2,1) 1.35s forwards}
.sp .pl2{position:relative;margin-top:14px;opacity:0;transform:translateY(8px);animation:spUp .6s ease 1.7s forwards}
.sp .sub{position:relative;margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.32em;color:rgba(169,161,214,.8);opacity:0;animation:spFade .6s ease 1.85s forwards}
/* version avec la vraie voiture 3D */
.sp.wait,.sp.wait *,.sp.wait::before{animation-play-state:paused!important}
.sp-st{display:none;position:relative;width:100vw;height:min(54vh,460px);margin-top:-6vh}
.sp-st canvas{display:block;width:100%;height:100%}
.sp.sp3d svg{display:none}
.sp.sp3d .sp-st{display:block}
.sp.sp3d{animation:none}
.sp.sp3d.out{animation:spOut .65s cubic-bezier(.6,0,.4,1) forwards}
.sp.sp3d.flip{animation:spBg .7s ease forwards}
.sp.sp3d h1{margin-top:0;animation-delay:1s}
.sp.sp3d .pl2{animation-delay:1.75s}
.sp.sp3d .sub{animation-delay:1.9s}
.sp.sp3d .sp-st::after{content:"";position:absolute;left:10%;right:10%;bottom:27%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#00e5ff,#ff3fd0,transparent);filter:blur(1px);box-shadow:0 0 18px #00e5ff;opacity:0;animation:spFade .8s ease .3s forwards}
@keyframes spBg{to{background-color:transparent;opacity:0;visibility:hidden}}
.cvfly{position:fixed!important;z-index:60;transition:left .7s cubic-bezier(.65,0,.35,1),top .7s cubic-bezier(.65,0,.35,1),width .7s cubic-bezier(.65,0,.35,1),height .7s cubic-bezier(.65,0,.35,1)}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFade{to{opacity:1}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spFlash{0%{opacity:0}12%{opacity:1}24%{opacity:.15}38%{opacity:1}100%{opacity:1}}
@keyframes spBeamA{0%{opacity:0;transform:scaleX(.2)}30%{opacity:.9}45%{opacity:.25}60%{opacity:.85;transform:scaleX(1)}100%{opacity:.6;transform:scaleX(1)}}
@keyframes spTitle{0%{opacity:0;letter-spacing:.9em;filter:blur(8px)}100%{opacity:1;letter-spacing:.32em;padding-left:.32em;filter:blur(0)}}
@keyframes spSweep{0%{transform:translate(-50%,-50%) rotate(-40deg);opacity:0}25%{opacity:.9}100%{transform:translate(-50%,-50%) rotate(220deg);opacity:0}}
@keyframes spOut{0%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.08);visibility:hidden}}
@media (prefers-reduced-motion:reduce){.sp,.sp *,.sp::before{animation-duration:.01s!important;animation-delay:0s!important}.sp{animation:spOut .3s ease .6s forwards!important}}
.hs b{text-align:right;line-height:1.35}.hs b small{font-weight:600;color:var(--fg-2)}
.hs-ok{color:var(--good)!important}.hs-warn{color:var(--warn)!important}.hs-bad{color:var(--bad)!important}
.hl-halo{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;opacity:0;z-index:2;will-change:transform,opacity;mix-blend-mode:screen;
  background:radial-gradient(circle,#fff 0,rgba(255,255,255,.98) 7%,rgba(215,245,255,.8) 15%,rgba(120,215,255,.38) 30%,rgba(0,229,255,.14) 48%,transparent 68%)}
.hl-halo::after{content:"";position:absolute;left:-55%;right:-55%;top:47%;height:6%;border-radius:50%;
  background:linear-gradient(90deg,transparent,rgba(190,240,255,.55) 30%,#fff 50%,rgba(190,240,255,.55) 70%,transparent)}
.sp-st{overflow:visible}
.isl{position:fixed;left:50%;top:11px;z-index:70;width:126px;height:37px;margin-left:-63px;border-radius:19px;background:#000;opacity:0;pointer-events:none;overflow:hidden;display:flex;align-items:center;
  transition:width .55s cubic-bezier(.3,1.32,.4,1),height .55s cubic-bezier(.3,1.32,.4,1),margin-left .55s cubic-bezier(.3,1.32,.4,1),border-radius .55s cubic-bezier(.3,1.32,.4,1),opacity .15s linear,box-shadow .4s,top .55s cubic-bezier(.3,1.32,.4,1)}
.isl.web{top:8px}
.isl.big{top:calc(env(safe-area-inset-top,47px) + 6px)}
.isl.web.big{top:8px}
.isl.glue.big{top:11px;width:232px;margin-left:-116px;height:84px;border-radius:34px}
.isl.glue .ic{width:36px;height:36px;margin-left:12px}.isl.glue svg{width:20px;height:20px}
.isl.glue .tx{margin:0 6px 0 10px}.isl.glue .tx b{font-size:14px}.isl.glue .tx small{font-size:11.5px}.isl.glue .rt{margin-right:14px;font-size:13.5px}
.isl.glue.big .ic,.isl.glue.big .tx,.isl.glue.big .rt{margin-top:16px}
.topbar{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bg);z-index:5;pointer-events:none}
.isl.on{opacity:1}
.isl.big{width:min(360px,calc(100vw - 20px));margin-left:calc(min(360px,calc(100vw - 20px)) / -2);height:70px;border-radius:35px;pointer-events:auto;box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04)}
.isl .ic{flex:0 0 auto;width:42px;height:42px;margin-left:14px;border-radius:21px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5);transition:opacity .25s .16s,transform .45s cubic-bezier(.3,1.5,.4,1) .14s}
.isl .tx{flex:1;min-width:0;margin:0 10px 0 12px;opacity:0;transform:translateY(5px);transition:opacity .25s .2s,transform .35s ease .2s}
.isl .tx b{display:block;color:#fff;font-size:15.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isl .tx small{display:block;margin-top:1px;color:rgba(235,235,245,.62);font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isl .rt{flex:0 0 auto;margin-right:18px;font-size:15px;font-weight:700;opacity:0;transition:opacity .25s .26s;font-variant-numeric:tabular-nums}
.isl.big .ic,.isl.big .tx,.isl.big .rt{opacity:1;transform:none}
.isl svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.isl[data-tone="good"] .ic{background:rgba(52,209,122,.2);color:#34d17a}.isl[data-tone="good"] .rt{color:#34d17a}
.isl[data-tone="warn"] .ic{background:rgba(255,176,32,.2);color:#ffb020}.isl[data-tone="warn"] .rt{color:#ffb020}
.isl[data-tone="bad"] .ic{background:rgba(255,77,79,.2);color:#ff4d4f}.isl[data-tone="bad"] .rt{color:#ff4d4f}
.isl[data-tone="info"] .ic{background:rgba(0,229,255,.16);color:#00e5ff}.isl[data-tone="info"] .rt{color:#00e5ff}

<script>
(function(){
'use strict';
var KEY='sandero-phone-1';
var db={trips:{},fills:{},snap:null,favs:{},tracks:{},details:{},tags:{}};
var sample=false,mOff=0,TAB='car';

var APP_V='2.51';

function updCheck(){
  if(!window.fetch||location.protocol.indexOf('http')!==0)return;
  fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
    var m=/var APP_V='([^']+)'/.exec(t||'');if(!m||m[1]===APP_V)return;
    var tried='';try{tried=localStorage.getItem('sandero-upd')||''}catch(e){}
    if(tried===m[1])return;
    try{localStorage.setItem('sandero-upd',m[1])}catch(e){}
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }).catch(function(){});
}
setTimeout(updCheck,1500);
document.addEventListener('visibilitychange',function(){if(!document.hidden)updCheck()});
var HARM={neon:['Néon','#00e5ff','255,0,170','0,229,255','neon'],synth:['Synthwave','#ff3fd0','255,120,40','150,60,255','neon'],ocean:['Océan','#3ad6ff','40,110,255','0,210,190','sombre'],
  aurore:['Aurore boréale','#34d17a','120,80,255','20,220,150','neon'],lavande:['Lavande','#c4a1ff','255,110,200','150,100,255','neon'],braise:['Braise','#ff6a3c','255,50,40','255,160,0','or'],
  ornuit:['Or de nuit','#ffc46b','255,170,60','40,90,200','or'],glacier:['Glacier','#9fd8ff','120,180,255','220,235,255','sombre'],menthe:['Menthe','#3ae0b0','0,190,170','60,140,255','sombre'],minuit:['Minuit','#a9a1d6','90,70,160','40,60,120','sombre']};

function setApply(){var a=ACC[SET.accent]||ACC.cyan,r=document.documentElement.style,H=typeof HARM!=='undefined'&&HARM[SET.harm];if(H)a=[H[1],hexRgb(H[1])];r.setProperty('--accent',a[0]);r.setProperty('--accent-rgb',a[1]);r.setProperty('--g1',H?H[2]:'255,0,170');r.setProperty('--g2',H?H[3]:'0,229,255');var m=document.getElementById('main');if(m)m.style.zoom={s:.92,m:1,l:1.1,xl:1.2}[SET.txt]||1}

var FPK='sandero-prix',FP=null,FPP=null,FUELS={e10:'SP95-E10',sp95:'SP95',sp98:'SP98',gazole:'Gazole'};

function fpFetch(force){
  if(sample)return Promise.resolve(false);if(FPP)return FPP;var F=fpLoad();
  if(!force&&F&&F.fuel===SET.fuel&&Date.now()-F.t<2*3600e3)return Promise.resolve(false);

  FPP=fetch(u).then(function(x){return x.ok?x.json():null}).then(function(j){

      return la==null||!(p>0)?null:{a:o.adresse||'',v:o.ville||'',la:la,lo:lo,p:p>10?p/1000:p,m:m,d:hav(pl,[la,lo])}}).filter(function(x){return x&&(!x.m||now-x.m<10*864e5)});

function fakeTrack(seed,rev){
  var W=[[43.2848,5.3826],[43.2884,5.3801],[43.2921,5.3788],[43.2953,5.3769],[43.2977,5.3806],[43.2993,5.3851],[43.3012,5.3893],[43.3041,5.3921],[43.3066,5.3962]];
  if(seed%3===1)W.splice(4,2,[43.2960,5.3830],[43.2985,5.3870]);

  for(var i=1;i<W.length;i++){var q=W[i-1],p=W[i];for(var j=1;j<=4;j++){var f=j/4,jt=((seed*7+i*13+j*5)%7-3)*4e-5;P.push([q[0]+(p[0]-q[0])*f+jt,q[1]+(p[1]-q[1])*f-jt])}}

  return o.join('.');

function fakeDet(n,seed,du){
  var c=[],v=[],t=[],i,step=Math.max(1,Math.round(du/n));
  for(i=0;i<n;i++){var w=Math.sin((i+seed)*.55)+Math.sin((i*1.7+seed)*.31);
    var sp=Math.max(0,Math.round(38+22*w+((i*7+seed)%9)-4));if(i===0||i===n-1)sp=Math.min(sp,12);
    var co=Math.round((sp<8?11.5:sp<25?8.6-sp*.05:sp>60?7.2:5.4+((i+seed)%5)*.25)*10+((i*13+seed)%7)-3);
    c.push(co.toString(36));v.push(sp.toString(36));t.push(Math.round(step*(sp<8?1.8:.8+((i+seed)%3)*.2)).toString(36));}
  return c.join('.')+','+v.join('.')+','+t.join('.');

    for(var j=ia+1;j<=ib;j++){if(F[j].litres==null){ok=false;break}lit+=F[j].litres;if(!F[j].full)np++}

/* ---------- animation d'ouverture : ta Sandero en 3D (sinon la version néon) ---------- */
(function(){
  var sp=document.getElementById('splash');if(!sp)return;
  var snap=(db&&db.snap)||null;
  if(snap&&snap.plate)document.getElementById('spplt').textContent=snap.plate;else if(!snap)document.getElementById('sppl').style.display='none';
  var done=false,cv=document.getElementById('car-gl'),home=cv.parentNode,next=cv.nextSibling;
  function putBack(){cv.classList.remove('cvfly');cv.style.left=cv.style.top=cv.style.width=cv.style.height='';if(cv.parentNode!==home)home.insertBefore(cv,next)}
  function end(){if(done)return;done=true;var was3d=sp&&sp.classList.contains('sp3d');putBack();if(sp&&sp.parentNode)sp.parentNode.removeChild(sp);sp=null;ANIM=true;try{render()}catch(e){}setTimeout(welcomeIsland,was3d?1500:300);if(was3d&&SET.flash&&window.Car3D&&window.Car3D.flash)setTimeout(function(){window.Car3D.flash()},120)}
  function neon(){if(!sp)return;sp.classList.remove('sp3d');putBack();sp.classList.remove('wait');setTimeout(end,3200)}
  sp.addEventListener('click',function(){if(!sp||done)return;sp.classList.add('skip');sp.classList.remove('wait');setTimeout(end,320)});
  sp.addEventListener('animationend',function(e){if(e.target===sp&&(e.animationName==='spOut'||e.animationName==='spBg'))end()});
  var gl=null;try{gl=document.createElement('canvas').getContext('webgl')}catch(e){}
  if(SET.splash==='off'){end();return}
  if(SET.splash==='neon'||!window.Car3D||!gl||matchMedia('(prefers-reduced-motion: reduce)').matches){neon();return}
  sp.classList.add('sp3d');
  document.getElementById('spst').appendChild(cv);
  var started=false,slow=setTimeout(function(){if(!started)neon()},2600);
  Car3D.cine(cv,{plate:(snap&&snap.plate)||'',paint:(snap&&snap.paint)||[24,42,126]},function(){started=true;clearTimeout(slow);if(sp)sp.classList.remove('wait')}).then(function(ok){
    if(!sp||done||!started)return;
    c3=true;
    var box=document.getElementById('car3d');
    if(box&&!box.classList.contains('hide')){
      /* la voiture glisse jusqu'à sa place dans l'onglet Voiture */
      var r0=cv.getBoundingClientRect(),r1=box.getBoundingClientRect();
      document.body.appendChild(cv);cv.classList.add('cvfly');
      cv.style.left=r0.left+'px';cv.style.top=r0.top+'px';cv.style.width=r0.width+'px';cv.style.height=r0.height+'px';
      sp.classList.add('flip');
      requestAnimationFrame(function(){requestAnimationFrame(function(){cv.style.left=r1.left+'px';cv.style.top=r1.top+'px';cv.style.width=r1.width+'px';cv.style.height=r1.height+'px'})});
      setTimeout(end,760);
    }else{sp.classList.add('out');setTimeout(end,700)}
  });
})();
})();
