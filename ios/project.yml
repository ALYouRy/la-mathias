name: LaMathias
options:
  bundleIdPrefix: fr.lamathias
  deploymentTarget:
    iOS: "16.2"
targets:
  LaMathias:
    type: application
    platform: iOS
    sources:
      - LaMathias
      - Shared
    dependencies:
      - target: LaMathiasWidget
    info:
      path: LaMathias/Info.plist
      properties:
        CFBundleDisplayName: La Mathias
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "La Mathias se connecte à ton boîtier OBD pour enregistrer tes trajets et la consommation de la voiture."
        NSLocationWhenInUseUsageDescription: "La Mathias enregistre le tracé de tes trajets."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Choisis « Toujours » : La Mathias enregistre le tracé de tes trajets même téléphone verrouillé, uniquement quand la voiture est connectée."
        NSCameraUsageDescription: "La caméra sert à scanner les QR codes de l’autoradio."
        NSPhotoLibraryUsageDescription: "Pour choisir une photo de QR code ou une sauvegarde."
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: fr.lamathias.app
            CFBundleURLSchemes: [lamathias]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lamathias.app
        CODE_SIGN_ENTITLEMENTS: LaMathias/LaMathias.entitlements
        PRODUCT_NAME: LaMathias
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: "NO"
  LaMathiasWidget:
    type: app-extension
    platform: iOS
    sources:
      - LaMathiasWidget
      - Shared
    info:
      path: LaMathiasWidget/Info.plist
      properties:
        CFBundleDisplayName: La Mathias
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lamathias.app.widget
        CODE_SIGN_ENTITLEMENTS: LaMathiasWidget/LaMathiasWidget.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        PRODUCT_NAME: LaMathiasWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
